<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>coding馬 · GitHub Pages 實驗</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", "PingFang HK", "Noto Sans TC", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, #1e3a5f, #0b1220 60%);
      color: #f4f7fb;
    }
    main {
      width: min(32rem, 92vw); padding: 2rem 1.75rem; border-radius: 1.25rem;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35); backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.65rem; letter-spacing: 0.02em; }
    p { margin: 0.65rem 0; line-height: 1.6; color: #d7e0ea; }
    .badge {
      display: inline-block; margin-bottom: 1rem; padding: 0.25rem 0.7rem;
      border-radius: 999px; font-size: 0.8rem; background: #3dd68c22; color: #7dffb3;
      border: 1px solid #3dd68c55;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #9ecbff; }
  </style>
</head>
<body>
  <main>
    <span class="badge">GitHub Pages · live</span>
    <h1>實驗成功</h1>
    <p>呢個頁面由 <strong>coding馬</strong> 開 repo、寫 HTML、merge 去 <code>main</code>，再開 GitHub Pages。</p>
    <p>Repo：<code>hong654321jp/test</code></p>
    <p>如果你睇到呢段字，即係成條 pipeline 已經行通。</p>
  </main>
</body>
</html>
